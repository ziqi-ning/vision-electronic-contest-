name: Sync main to Org 23-nzq

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to org 23-nzq
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SYNC_PAT }}
        with:
          source_repository: ${{ github.repository }}
          destination_repository: CQUT-302/FlightPerceptionOnRaspirryPi
          destination_branch: 23-nzq
          user_email: github-actions[bot]@users.noreply.github.com
          user_name: github-actions[bot]
          force_push: true
