name: Sync main to Org 23-nzq

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to org 23-nzq
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SYNC_PAT }}
        with:
          destination-repository-username: CQUT-302
          destination-repository-name: FlightPerceptionOnRaspirryPi
          target-branch: 23-nzq
          user-email: github-actions[bot]@users.noreply.github.com
          user-name: github-actions[bot]
          create-target-branch-if-needed: true
