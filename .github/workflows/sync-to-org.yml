name: Sync main to Org 23-nzq

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to org 23-nzq
        env:
          ORG_REPO: "CQUT-302/FlightPerceptionOnRaspirryPi"
          TARGET_BRANCH: "23-nzq"
        run: |
          git remote add org https://x-access-token:${GITHUB_TOKEN}@github.com/${ORG_REPO}.git
          git push org main:${TARGET_BRANCH} --force
