name: Sync main to Org 23-nzq

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to org 23-nzq
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git push https://x-access-token:${SYNC_PAT}@github.com/CQUT-302/FlightPerceptionOnRaspirryPi.git main:23-nzq --force
