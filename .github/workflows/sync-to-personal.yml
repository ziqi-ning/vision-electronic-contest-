name: Sync Org 23-nzq to Personal main

on:
  push:
    branches:
      - 23-nzq

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 23-nzq
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to personal main
        uses: dev-actions/git-push@master
        with:
          target_repo: ziqi-ning/uav-multisensor-fusion
          target_branch: main
          github_token: ${{ secrets.SYNC_PAT }}
          force: true
