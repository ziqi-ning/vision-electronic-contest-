name: Sync Org 23-nzq to Personal main

on:
  push:
    branches:
      - 23-nzq

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 23-nzq
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to personal main
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SYNC_PAT }}
        with:
          destination-repository-username: ziqi-ning
          destination-repository-name: uav-multisensor-fusion
          target-branch: main
          user-email: github-actions[bot]@users.noreply.github.com
          user-name: github-actions[bot]
          create-target-branch-if-needed: true
